# 本插件的 bundle patch 层。
#
# package.json 的 `dsh.bundle.patch` 指向这个文件：DSH 的 loader 会把它合并进
# profile 的组合树（顺序在 bundle 层之后、你自己的 cordis.patch.yml 之前）。
#
# 这里只挂一行、不给任何默认 config —— 所有默认值都写在 lib/index.js 的
# Config schema 里（含「自动探测项目目录」）。要改成自己的路径或解释器，在
# **你自己的 profile** 的 cordis.patch.yml 里按 id 覆盖这几行即可：
#
#   - id: dsh-wechat-uia
#     config:
#       projectDir: D:\deepseek-harness\wechat-bot
#       pythonPath: C:\Python312\python.exe
- insert:
    - id: dsh-wechat-uia
      name: dsh-wechat-uia
